services:
  omniroute-redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: ${CONTAINER_NAME}-redis
    restart: unless-stopped
    volumes:
      - ${OMNIROUTE_DATA}/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://omniroute-redis:6379
      - DASHBOARD_PORT=${DASHBOARD_PORT}
      - API_PORT=${API_PORT}
      - LIVE_WS_PORT=${LIVE_WS_PORT}
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
      - "${API_PORT}:${API_PORT}"
      - "${LIVE_WS_PORT}:${LIVE_WS_PORT}"
    volumes:
      - ${OMNIROUTE_DATA}:/app/data
    depends_on:
      omniroute-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s