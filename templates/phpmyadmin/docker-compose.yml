services:
  phpmyadmin:
    container_name: ${CONTAINER_NAME:-phpmyadmin}
    image: docker.io/library/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_ARBITRARY: "1"

networks:
  database:
    name: "${DATABASE_NETWORK:-bridge}"
    external: true
  phpmyadmin:
    name: phpmyadmin